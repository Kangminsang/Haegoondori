name: Build debug APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "빌드할 브랜치/태그/SHA (비우면 선택한 브랜치)"
        type: string
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 디버그 키스토어 복원
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 Secret이 없어 실행마다 서명 키가 달라 덮어 설치할 수 없다."
          fi

      - name: 디버그 APK 빌드
        run: ./gradlew :app:assembleDebug

      - name: 짧은 SHA 구하기
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: hagoondori-debug-${{ steps.sha.outputs.short }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
