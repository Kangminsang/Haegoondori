name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 태그와 versionName 확인
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          version="${version%%-*}"
          gradle_version="$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$version" != "$gradle_version" ]; then
            echo "::error::태그 버전($version)이 app/build.gradle.kts의 versionName($gradle_version)과 다릅니다."
            exit 1
          fi

      - name: Secrets 확인
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name 이(가) 비어 있습니다."
              missing=1
            fi
          done
          exit $missing

      - name: 단위 테스트
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: 키스토어 복원
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: 릴리스 APK 빌드
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: 서명 검증 및 산출물 준비
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          apk="app/build/outputs/apk/release/app-release.apk"
          "$apksigner" verify --print-certs "$apk"
          out="hagoondori-${TAG_NAME#v}.apk"
          mv "$apk" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "ASSET_APK=$out" >> "$GITHUB_ENV"

      - name: GitHub Release 게시
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$ASSET_APK" "$ASSET_APK.sha256" --clobber
          else
            flags=()
            case "$TAG_NAME" in
              *-*) flags+=(--prerelease) ;;
            esac
            gh release create "$TAG_NAME" "$ASSET_APK" "$ASSET_APK.sha256" \
              --verify-tag --generate-notes --title "$TAG_NAME" "${flags[@]}"
          fi

      - name: 키스토어 삭제
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
